name: Publish

on:
  push:
    tags: ["v*"]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  versions:
    name: Check release versions
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: "3.12"
      - name: Check manifests, locks, notes and tag
        env:
          RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: uv run --no-project --python 3.12 .github/scripts/validate_publish_artifacts.py versions --tag "$RELEASE_TAG"
      - name: Verify release gate failures
        run: uv run --no-project --python 3.12 --with pytest pytest --noconftest tests/test_release.py -q

  wheels:
    name: Wheel / ${{ matrix.target }} / ${{ matrix.os }}
    needs: versions
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04, target: x86_64, manylinux: manylinux_2_28 }
          - { os: ubuntu-24.04-arm, target: aarch64, manylinux: manylinux_2_28 }
          - { os: windows-2025, target: x64, manylinux: auto }
          - { os: macos-15-intel, target: x86_64, manylinux: auto }
          - { os: macos-15, target: aarch64, manylinux: auto }
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: "3.12"
      - name: Build locked release wheel
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          args: --release --locked --out dist -i ${{ runner.os == 'Linux' && 'python3.12' || 'python' }}
          manylinux: ${{ matrix.manylinux }}
      - name: Validate exact wheel / Python 3.12 / Polars 1
        run: uv run --no-project --python 3.12 .github/scripts/validate_publish_artifacts.py validate dist/*.whl --python 3.12 --polars 'polars==1.40.0' --output provenance/python312.json
      - name: Validate exact wheel / Python 3.14 / Polars 2
        run: uv run --no-project --python 3.12 .github/scripts/validate_publish_artifacts.py validate dist/*.whl --python 3.14 --polars 'polars==2.0.0' --output provenance/python314.json
      - uses: actions/upload-artifact@v7
        with:
          name: wheels-${{ matrix.os }}-${{ matrix.target }}
          path: dist/*.whl
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: validation-${{ matrix.os }}-${{ matrix.target }}
          path: provenance/

  sdist:
    name: Source distribution / rebuild and install
    needs: versions
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: "3.12"
      - name: Build source archive
        run: uv run --no-project --python 3.12 --with maturin==1.15.0 maturin sdist --out dist
      - name: Inspect and rebuild exact source archive
        run: uv run --no-project --python 3.12 --with maturin==1.15.0 .github/scripts/validate_publish_artifacts.py rebuild dist/*.tar.gz --out rebuilt
      - name: Validate rebuilt wheel / Python 3.12
        run: uv run --no-project --python 3.12 .github/scripts/validate_publish_artifacts.py validate rebuilt/*.whl --python 3.12 --polars 'polars==1.40.0' --output provenance/sdist-python312.json --source dist/*.tar.gz
      - name: Validate rebuilt wheel / Python 3.14
        run: uv run --no-project --python 3.12 .github/scripts/validate_publish_artifacts.py validate rebuilt/*.whl --python 3.14 --polars 'polars==2.0.0' --output provenance/sdist-python314.json --source dist/*.tar.gz
      - name: Record source archive hash
        run: uv run --no-project --python 3.12 .github/scripts/validate_publish_artifacts.py inspect dist/*.tar.gz > provenance/sdist.json
      - uses: actions/upload-artifact@v7
        with:
          name: wheels-sdist
          path: dist/*.tar.gz
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: validation-sdist
          path: provenance/

  qualify:
    name: Verify complete tested artifact set
    needs: [versions, wheels, sdist]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: wheels-*
          path: dist
          merge-multiple: true
      - uses: actions/download-artifact@v8
        with:
          pattern: validation-*
          path: validation
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: "3.12"
      - name: Match all six artifacts to successful validation records
        run: uv run --no-project --python 3.12 .github/scripts/validate_publish_artifacts.py verify dist --reports validation

  publish:
    name: Publish validated artifacts to PyPI
    # Manual runs always stop after validation, including dispatches on a tag.
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: qualify
    runs-on: ubuntu-24.04
    environment: pypi
    permissions:
      id-token: write
      contents: write
      attestations: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: wheels-*
          path: dist
          merge-multiple: true
      - uses: actions/download-artifact@v8
        with:
          pattern: validation-*
          path: validation
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: "3.12"
      - name: Recheck downloaded artifact metadata and hashes
        run: uv run --no-project --python 3.12 .github/scripts/validate_publish_artifacts.py verify dist --reports validation
      - uses: actions/attest-build-provenance@v4
        with:
          subject-path: "dist/*"
      - name: Publish to PyPI
        run: uv publish --trusted-publishing always dist/*
