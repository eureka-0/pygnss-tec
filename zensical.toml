[project]
site_name = "PyGNSS-TEC"
site_description = "GNSS observations and total electron content with Python, Rust and Polars."
site_url = "https://eureka-0.github.io/pygnss-tec/"
repo_url = "https://github.com/Eureka-0/pygnss-tec"
repo_name = "Eureka-0/pygnss-tec"
edit_uri = "edit/main/docs/"
docs_dir = "docs"
site_dir = "site"
extra_css = ["assets/stylesheets/api.css"]
extra_javascript = [
    "assets/javascripts/mathjax.js",
    "https://unpkg.com/mathjax@3.2.2/es5/tex-mml-chtml.js",
]
exclude_docs = """
/agents/
/tasks/
/templates/
/roadmap-history.md
"""
nav = [
    { "Home" = "index.md" },
    { "Quick Start" = "quick-start.md" },
    { "Documentation" = [
        "guide/index.md",
        { "RINEX Observations" = "guide/rinex.md" },
        { "TEC Calculation" = "guide/tec-calculation.md" },
        { "Configuration" = "guide/configuration.md" },
        { "Scientific Conventions" = "guide/scientific-conventions.md" },
    ] },
    { "API Reference" = [
        "api/index.md",
        { "Input and Output" = "api/io.md" },
        { "Observation Geometry" = "api/geometry.md" },
        { "TEC Calculation" = "api/tec.md" },
        { "Configuration" = "api/configuration.md" },
    ] },
    { "Contributing" = "contributing.md" },
]

[project.theme]
language = "en"
features = [
    "navigation.tabs",
    "navigation.sections",
    "navigation.indexes",
    "navigation.top",
    "navigation.footer",
    "content.code.copy",
]

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
toggle.icon = "lucide/moon"
toggle.name = "Switch to light mode"

[project.validation]
invalid_links = true
invalid_link_anchors = true

[project.markdown_extensions.admonition]
[project.markdown_extensions.tables]
[project.markdown_extensions.attr_list]
[project.markdown_extensions.pymdownx.superfences]
[project.markdown_extensions.pymdownx.highlight]
[project.markdown_extensions.pymdownx.arithmatex]
generic = true
[project.markdown_extensions.toc]
permalink = true

[project.plugins.mkdocstrings]
custom_templates = "docs/templates"

[project.plugins.mkdocstrings.handlers.python]
paths = ["."]

[project.plugins.mkdocstrings.handlers.python.options]
docstring_style = "numpy"
allow_inspection = false
members_order = "source"
show_root_heading = true
show_root_full_path = false
show_source = false
separate_signature = true
line_length = 88
show_signature_annotations = true
heading_level = 2

[project.plugins.mkdocstrings.handlers.python.options.extra]
source_url = "https://github.com/Eureka-0/pygnss-tec/blob/main"
